name: Release aemet-mcp

on:
  push:
    tags:
      - "aemet-mcp-v*"

jobs:
  publish:
    name: Publish aemet-mcp to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json and server.json versions
        id: versions
        run: |
          raw="${GITHUB_REF#refs/tags/}"
          tag="${raw#aemet-mcp-v}"
          pkg=$(node -p "require('./packages/aemet-mcp/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $raw does not match aemet-mcp package version $pkg"
            exit 1
          fi
          server=$(node -p "require('./packages/aemet-mcp/server.json').version")
          serverPkg=$(node -p "require('./packages/aemet-mcp/server.json').packages[0].version")
          if [ "$tag" != "$server" ] || [ "$tag" != "$serverPkg" ]; then
            echo "::error::server.json says $server / $serverPkg, tag says $tag. The MCP Registry entry would not match the published package."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if npm view "aemet-mcp@$tag" version >/dev/null 2>&1; then
            echo "already-on-npm=true" >> "$GITHUB_OUTPUT"
            echo "aemet-mcp@$tag is already published; the npm step will be skipped so the run can be retried."
          else
            echo "already-on-npm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the aemet-client version it depends on is on npm
        run: |
          dep=$(node -p "require('./packages/aemet-client/package.json').version")
          if ! npm view "aemet-client@$dep" version >/dev/null 2>&1; then
            echo "::error::aemet-client@$dep is not published. pnpm rewrites the workspace dependency to ^$dep, so publishing now would ship a broken install. Tag aemet-client-v$dep first."
            exit 1
          fi

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm --filter aemet-mcp test

      - name: Publish
        if: steps.versions.outputs.already-on-npm != 'true'
        run: pnpm --filter aemet-mcp publish --access public --provenance --no-git-checks

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        working-directory: packages/aemet-mcp
        run: |
          ../../mcp-publisher login github-oidc
          ../../mcp-publisher publish
